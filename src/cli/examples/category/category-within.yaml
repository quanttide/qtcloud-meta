# examples/category/category-within.yaml —— 范畴「category-within」的本体定义
# 描述的是范畴内（within）实现自己的结构：src/category/within.rs 与共用的 common.rs 里的
# 类型作概念，类型之间的关系作边，报告必须具备的段落作公理。schema 见 docs/dev-guide/category/within.md。
name: CategoryWithin
source: "src/cli/src/category/{within.rs, common.rs} 的模块结构"
version: "1.0"

concepts:
  - { name: OntologyDef,  label: { zh: 本体定义 } }
  - { name: ConceptDef,   label: { zh: 概念定义 } }
  - { name: EdgeDef,      label: { zh: 边定义 } }
  - { name: AxiomDef,     label: { zh: 公理定义 } }
  - { name: Report,       label: { zh: 报告 } }
  - { name: Step,         label: { zh: 步骤行 } }
  - { name: StepStatus,   label: { zh: 步骤状态 } }
  - { name: Results,      label: { zh: 结果 } }
  - { name: LoadedInfo,   label: { zh: 装载结果 } }
  - { name: AnalyzedInfo, label: { zh: 分析结果 } }
  - { name: LawGroup,     label: { zh: 公理组 } }
  - { name: RelationInfo, label: { zh: 关系行 } }

edges:
  - { from: OntologyDef,  to: ConceptDef,   kind: HasConcepts }
  - { from: OntologyDef,  to: EdgeDef,      kind: HasEdges }
  - { from: OntologyDef,  to: AxiomDef,     kind: HasAxioms }
  - { from: Report,       to: Step,         kind: HasTrace }
  - { from: Report,       to: Results,      kind: HasResults }
  - { from: Step,         to: StepStatus,   kind: HasStatus }
  - { from: Results,      to: LoadedInfo,   kind: HasLoaded }
  - { from: Results,      to: AnalyzedInfo, kind: HasAnalyzed }
  - { from: AnalyzedInfo, to: LawGroup,     kind: HasLawGroup }
  - { from: Report,       to: RelationInfo, kind: HasRelations }

axioms:
  - id: ax-report-has-trace
    description: "报告必须有过程轨迹"
    type: cardinality
    target: Report
    relation: HasTrace
    constraint: "min: 1"
  - id: ax-results-has-loaded
    description: "结果必须有装载段"
    type: cardinality
    target: Results
    relation: HasLoaded
    constraint: "min: 1"
  - id: ax-results-has-analyzed
    description: "结果必须有分析段"
    type: cardinality
    target: Results
    relation: HasAnalyzed
    constraint: "min: 1"
