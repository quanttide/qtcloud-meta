# examples/category/category-between.yaml —— 范畴「category-between」的本体定义
# 描述的是范畴间（between）实现自己的结构：src/category/between.rs 里的类型作概念，
# 类型之间的关系作边，报告必须具备的段落作公理。schema 见 docs/dev-guide/category/within.md。
name: CategoryBetween
source: "src/cli/src/category/between.rs 的模块结构"
version: "1.0"

concepts:
  - { name: BetweenDef,      label: { zh: 范畴间定义 } }
  - { name: MappingDef,      label: { zh: 映射行 } }
  - { name: ConflictDef,     label: { zh: 冲突行 } }
  - { name: Report,          label: { zh: 范畴间报告 } }
  - { name: StepInfo,        label: { zh: 步骤行 } }
  - { name: TranslationInfo, label: { zh: 翻译行 } }
  - { name: Options,         label: { zh: 命令行选项 } }

edges:
  - { from: BetweenDef, to: MappingDef,      kind: HasMappings }
  - { from: BetweenDef, to: ConflictDef,     kind: HasConflicts }
  - { from: Report,     to: StepInfo,        kind: HasSteps }
  - { from: Report,     to: TranslationInfo, kind: HasConclusion }

axioms:
  - id: ax-report-has-steps
    description: "范畴间报告必须有步骤段"
    type: cardinality
    target: Report
    relation: HasSteps
    constraint: "min: 1"
