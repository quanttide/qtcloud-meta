# 发布 CLI：推送 tag（cli/*，如 cli/v0.1.0-alpha.1）时：
#   check → quality-gates → build-binaries（三平台矩阵）→ upload-release-assets → publish-crate（crates.io）
# 结构对齐 qtcloud-work 的 release-cli.yml；该仓特有的用例对账与行数门禁不适用本仓
# （本仓没有 tests/ 用例制度，也没有「单文件 ≤ 250 行」的约定），因此不设。

name: release-cli

on:
  push:
    tags:
      - 'cli/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#cli/}" >> $GITHUB_OUTPUT
      - name: validate version
        run: ./scripts/validate-version.sh "${{ github.ref_name }}"
      - name: validate changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ./scripts/validate-changelog.sh "${VERSION#v}"

  quality-gates:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --check
      - name: test
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: publish dry run
        run: cargo publish --dry-run --locked

  build-binaries:
    needs: quality-gates
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: build binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: upload binary
        uses: actions/upload-artifact@v5
        with:
          name: qtcloud-meta-${{ matrix.target }}
          path: ${{ github.workspace }}/src/cli/target/${{ matrix.target }}/release/qtcloud-meta${{ matrix.ext }}

  upload-release-assets:
    needs: [check, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: qtcloud-meta-*
          path: release-assets
      - name: normalize asset names
        run: |
          mv release-assets/qtcloud-meta-x86_64-unknown-linux-gnu/qtcloud-meta release-assets/qtcloud-meta-linux-x86_64
          mv release-assets/qtcloud-meta-aarch64-apple-darwin/qtcloud-meta release-assets/qtcloud-meta-macos-arm64
          mv release-assets/qtcloud-meta-x86_64-pc-windows-msvc/qtcloud-meta.exe release-assets/qtcloud-meta-windows-x86_64.exe
          chmod +x release-assets/qtcloud-meta-linux-x86_64 release-assets/qtcloud-meta-macos-arm64
      - name: ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
      - name: mark prerelease when applicable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#cli/}"
          case "$VERSION" in
            *-alpha.*|*-beta.*|*-rc.*)
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
              ;;
          esac
      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/qtcloud-meta-linux-x86_64
          release-assets/qtcloud-meta-macos-arm64
          release-assets/qtcloud-meta-windows-x86_64.exe
          --repo "$GITHUB_REPOSITORY" --clobber

  publish-crate:
    # 预发布也推 crates.io（`0.1.0-alpha.N` 是合法的 crates.io 版本）。
    needs: [quality-gates, upload-release-assets]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: publish to crates.io
        env:
          CRATE_NAME: qtcloud-meta-cli
          # token 在 Org level 配置，认两个名字
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # 版本从 tag 现取：cli/v0.1.0-alpha.1 → 0.1.0-alpha.1（crates.io 的 API 不带 v 前缀）
          VERSION="${GITHUB_REF_NAME#cli/v}"
          echo "准备发布 ${CRATE_NAME}@${VERSION}"
          # crates.io 要求带 User-Agent，不带会被 403 挡回（与 token 无关）。
          AGENT="qtcloud-meta-release (+https://github.com/quanttide/qtcloud-meta)"
          status="$(curl --silent --show-error --user-agent "$AGENT" --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}")"
          case "$status" in
            200)
              echo "${CRATE_NAME}@${VERSION} 已存在于 crates.io，跳过重复发布。"
              ;;
            404)
              cargo publish --locked
              ;;
            *)
              echo "无法确认 ${CRATE_NAME}@${VERSION} 是否已发布（HTTP ${status}）。" >&2
              exit 1
              ;;
          esac

      - name: mark pre-release
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --prerelease
